id = "csv-columns"
name = "CSV Columns"
version = "0.1.6"
schema_version = 1
authors = ["SirToffski <47118864+SirToffski@users.noreply.github.com>"]
description = "Rainbow column highlighting for CSV/TSV, fast on large files, plus column Align/Shrink and virtual alignment via a language server."
repository = "https://github.com/SirToffski/zed_csv_utils"

# csv-lsp is downloaded from this repository's GitHub releases.
capabilities = [
    { kind = "download_file", host = "github.com", path = ["SirToffski", "zed_csv_utils", "**"] },
]

# Grammars live in grammar/ (see README "Grammar"). Zed builds them from a
# commit, so re-pin all four after changing and committing the grammar.
[grammars.csv]
repository = "https://github.com/SirToffski/zed_csv_utils"
commit = "195a4502fb5dc4b94038db24877ec90d60ee4094"
path = "grammar/csv"

[grammars.ssv]
repository = "https://github.com/SirToffski/zed_csv_utils"
commit = "195a4502fb5dc4b94038db24877ec90d60ee4094"
path = "grammar/ssv"

[grammars.tsv]
repository = "https://github.com/SirToffski/zed_csv_utils"
commit = "195a4502fb5dc4b94038db24877ec90d60ee4094"
path = "grammar/tsv"

[grammars.psv]
repository = "https://github.com/SirToffski/zed_csv_utils"
commit = "195a4502fb5dc4b94038db24877ec90d60ee4094"
path = "grammar/psv"

[language_servers.csv-lsp]
name = "CSV Align LSP"
languages = ["CSV Columns (,)", "TSV Columns (⭲)", "CSV Columns (;)", "CSV Columns (|)"]

[language_servers.csv-lsp.language_ids]
"CSV Columns (,)" = "csv"
"TSV Columns (⭲)" = "tsv"
"CSV Columns (;)" = "csv-semicolon"
"CSV Columns (|)" = "csv-pipe"

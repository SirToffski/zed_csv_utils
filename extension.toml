id = "rainbow-csv-align"
name = "Rainbow CSV with Align"
version = "0.1.0"
schema_version = 1
authors = ["zed_csv contributors"]
description = "Rainbow highlight for CSV/TSV plus Align/Shrink via language server (formatting + inlay hints). Combines zed-rainbow-csv highlighting with vscode_rainbow_csv align logic."
repository = "https://github.com/Kalmaegi/zed-rainbow-csv"

[grammars.csv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "csv"

[grammars.ssv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "ssv"

[grammars.tsv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "tsv"

[grammars.psv]
repository = "https://github.com/coroa/rainbow-csv-tree-sitter"
commit = "d82f436727f74298bd587ee696dca903efc42ce6"
path = "psv"

[language_servers.csv-lsp]
name = "CSV Align LSP"
languages = ["Rainbow CSV (,)", "Rainbow TSV (⭲)", "Rainbow CSV (;)", "Rainbow CSV (|)"]

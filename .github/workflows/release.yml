# Builds csv-lsp for every platform the extension downloads for, and publishes
# a GitHub release when a `v*` tag is pushed.
#
# Asset names must match `platform_asset()` in src/lib.rs:
#   csv-lsp-<arch>-<target>.tar.gz   (Linux, macOS; binary `csv-lsp` at root)
#   csv-lsp-<arch>-<target>.zip      (Windows;      binary `csv-lsp.exe` at root)
#
# Run manually (workflow_dispatch) to test the builds without releasing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl: statically linked, runs on any Linux distro regardless of glibc.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # crt-static: link the C runtime into the exe so it doesn't need
          # vcruntime140.dll (the VC++ redistributable) on the user's machine.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, rustflags: "-C target-feature=+crt-static" }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, rustflags: "-C target-feature=+crt-static" }
    runs-on: ${{ matrix.os }}
    env:
      # Empty for targets that don't set `rustflags` in the matrix.
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Release tuning for the server binary only; set here rather than in
      # Cargo.toml so the extension's own wasm build is unaffected.
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p csv_lsp --bin csv-lsp --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/csv-lsp-${{ matrix.target }}.tar.gz" csv-lsp

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/csv-lsp.exe" -DestinationPath "dist/csv-lsp-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: csv-lsp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches extension.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' extension.toml | head -n1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match extension.toml version ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # The release is created only after every platform built successfully,
      # so the extension never sees a release with missing assets.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
